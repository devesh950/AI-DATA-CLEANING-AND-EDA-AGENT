[server]
# Increase file upload size limit to 2GB (2048 MB)
maxUploadSize = 2048

# Increase message size limit to handle large datasets
maxMessageSize = 2048

# Enable file watcher for better development experience
fileWatcherType = "auto"

# Disable XSRF protection for local development (allows CORS to be disabled)
enableXsrfProtection = false
enableCORS = false

# Enable WebSocket compression for better performance with large files
enableWebsocketCompression = true

[browser]
# Automatically open browser when starting
gatherUsageStats = false

[theme]
# Optional: Set a custom theme
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"